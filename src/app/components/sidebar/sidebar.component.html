<nav class="sidebar" aria-label="Main navigation">
  <!-- Sidebar header: profile chip + search icon -->
  <div class="sidebar-header">
    <div class="profile-menu">
      <button
        type="button"
        class="profile-chip"
        (click)="toggleProfileMenu($event)"
        [attr.aria-expanded]="profileMenuOpen"
        aria-haspopup="menu"
        aria-label="Account menu"
      >
        <div class="avatar" [ngClass]="{ 'avatar--placeholder': !avatarUrl }">
          <img *ngIf="avatarUrl" [src]="avatarUrl" alt="" />
          <span *ngIf="!avatarUrl" class="avatar-initials">{{ displayName[0]?.toUpperCase() }}</span>
        </div>
        <span class="profile-name">{{ displayName }}</span>
        <svg class="chevron" [class.chevron--open]="profileMenuOpen" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <div *ngIf="profileMenuOpen" class="profile-dropdown" role="menu">
        <a role="menuitem" routerLink="/profile" (click)="closeProfileMenu(); onEntryClick()">
          My Profile
        </a>
        <button type="button" role="menuitem" class="sign-out" (click)="signOut()">
          Sign Out
        </button>
      </div>
    </div>
    <a
      class="sidebar-search-btn"
      routerLink="/search"
      (click)="onEntryClick()"
      aria-label="Search"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="20" height="20">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0016.803 15.803z" />
      </svg>
    </a>
  </div>

  <!-- League switcher: only meaningful once the user follows more than one -->
  <div class="league-switcher" *ngIf="followedLeagues.length">
    <button
      type="button"
      class="league-chip"
      (click)="toggleLeagueMenu($event)"
      [attr.aria-expanded]="leagueMenuOpen"
      [disabled]="followedLeagues.length < 2"
      aria-haspopup="menu"
      aria-label="Switch league"
    >
      <span class="league-name">{{ selectedLeagueName }}</span>
      <svg
        *ngIf="followedLeagues.length > 1"
        class="chevron"
        [class.chevron--open]="leagueMenuOpen"
        viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
      </svg>
    </button>

    <div *ngIf="leagueMenuOpen" class="league-dropdown" role="menu">
      <button
        type="button"
        role="menuitemradio"
        *ngFor="let league of followedLeagues"
        class="league-option"
        [class.league-option--active]="league.leagueId === selectedLeagueId"
        [attr.aria-checked]="league.leagueId === selectedLeagueId"
        (click)="selectLeague(league)"
      >
        <span class="league-option-name">{{ league.name }}</span>
        <span class="league-option-meta">{{ league.isDynasty ? 'Dynasty' : 'Redraft' }} · {{ league.totalRosters }} teams</span>
      </button>
    </div>
  </div>

  <!-- Sections -->
  <div class="sections">
    <div *ngFor="let section of visibleSections" class="section">
      <div class="section-title">{{ section.title }}</div>
      <ul>
        <li *ngFor="let entry of visibleEntries(section)">
          <a
            class="entry"
            [routerLink]="entry.route"
            [queryParams]="entry.queryParams ?? {}"
            routerLinkActive="entry--active"
            (click)="onEntryClick()"
          >
            <span class="entry-icon" aria-hidden="true" [innerHTML]="safeIcon(entry)"></span>
            <span class="entry-label">{{ entry.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Sticky footer — Settings -->
  <div class="sidebar-footer">
    <a class="entry" routerLink="/settings" routerLinkActive="entry--active" (click)="onEntryClick()">
      <span class="entry-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </span>
      <span class="entry-label">Settings</span>
    </a>
  </div>

  <!-- Pinned to the bottom: where this came from and how to read it. -->
  <div class="sidebar-footer">
    <a
      class="footer-link"
      href="https://xomware.com"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18zM3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 010 18 15 15 0 010-18z" />
      </svg>
      <span>Xomware</span>
    </a>
    <a
      class="footer-link"
      href="https://github.com/Xomware/xomper-frontend"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
        <path d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 007.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.3-1.7-1.3-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.25 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0023.5 12C23.5 5.73 18.27.5 12 .5z" />
      </svg>
      <span>Source</span>
    </a>
  </div>
</nav>
