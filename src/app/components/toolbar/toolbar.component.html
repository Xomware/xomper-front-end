<nav class="toolbar" [ngClass]="{ 'show-dropdown': dropdownVisible }" role="navigation" aria-label="Main navigation">
  <h2 class="app-title">
    <img
      class="banner-icon"
      src="assets/img/xomper-banner.png"
      alt="XOMPER - Go to home"
      (click)="goHome()"
      (keydown.enter)="goHome()"
      tabindex="0"
      style="cursor: pointer;"
    />
  </h2>

  <!-- Desktop Tabs -->
  <div class="tabs" [ngClass]="{ hidden: dropdownVisible }">
    <div class="nav-links">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>
      <a routerLink="/search" routerLinkActive="active">
        Search
      </a>
      <ng-container *ngIf="isLoggedIn()">
        <a *ngIf="userId" routerLink="/my-profile" [queryParams]="{ userId: userId }" routerLinkActive="active">
          My Profile
        </a>

        <!-- My League Dropdown -->
        <div *ngIf="leagueId" class="league-dropdown-wrapper">
          <a
            class="league-trigger"
            [class.active]="isLeagueRouteActive()"
            (click)="toggleLeagueDropdown($event)"
            (keydown.enter)="toggleLeagueDropdown($event)"
            tabindex="0"
            role="button"
            [attr.aria-expanded]="leagueDropdownVisible"
            aria-haspopup="true"
          >
            My League
            <span class="dropdown-arrow" [class.open]="leagueDropdownVisible" aria-hidden="true">&#9662;</span>
          </a>
          <div class="league-dropdown" *ngIf="leagueDropdownVisible" role="menu">
            <a role="menuitem" (click)="navigateLeagueFeature('/my-league', { leagueId: leagueId!, view: 'league' })">
              League Home
            </a>
            <a role="menuitem" (click)="navigateLeagueFeature('/draft-history')">
              Draft History
            </a>
            <a role="menuitem" (click)="navigateLeagueFeature('/my-league', { leagueId: leagueId!, view: 'league', tab: 'matchups' })">
              Matchups
            </a>
            <a role="menuitem" (click)="navigateLeagueFeature('/my-league', { leagueId: leagueId!, view: 'league', tab: 'rules' })">
              Rules
            </a>
          </div>
        </div>

        <a *ngIf="teamUserName" routerLink="/my-team" [queryParams]="{ user: teamUserName, league: teamLeagueId }" routerLinkActive="active">
          My Team
        </a>
      </ng-container>
    </div>

    <button *ngIf="isLoggedIn()" class="sign-out-btn" (click)="signOut()" aria-label="Sign out">
      Sign Out
    </button>
  </div>

  <!-- Mobile Menu Button -->
  <button
    class="dropdown-button"
    (click)="toggleDropdown()"
    [attr.aria-expanded]="dropdownVisible"
    aria-label="Toggle navigation menu"
    aria-controls="mobile-menu"
  >&#9776;</button>

  <!-- Mobile Dropdown -->
  <div class="dropdown" id="mobile-menu" *ngIf="dropdownVisible" role="menu">
    <a role="menuitem" routerLink="/home" (click)="closeMobileMenu()">Home</a>
    <a role="menuitem" routerLink="/search" (click)="closeMobileMenu()">Search</a>

    <ng-container *ngIf="isLoggedIn()">
      <div class="dropdown-section-header">My Stuff</div>

      <a role="menuitem" *ngIf="userId" routerLink="/my-profile" [queryParams]="{ userId: userId }" (click)="closeMobileMenu()">
        My Profile
      </a>
      <a role="menuitem" *ngIf="teamUserName" routerLink="/my-team" [queryParams]="{ user: teamUserName, league: teamLeagueId }" (click)="closeMobileMenu()">
        My Team
      </a>

      <ng-container *ngIf="leagueId">
        <div class="dropdown-section-header">My League</div>

        <a role="menuitem" (click)="navigateLeagueFeature('/my-league', { leagueId: leagueId!, view: 'league' })">
          League Home
        </a>
        <a role="menuitem" (click)="navigateLeagueFeature('/draft-history')">
          Draft History
        </a>
        <a role="menuitem" (click)="navigateLeagueFeature('/my-league', { leagueId: leagueId!, view: 'league', tab: 'matchups' })">
          Matchups
        </a>
        <a role="menuitem" (click)="navigateLeagueFeature('/my-league', { leagueId: leagueId!, view: 'league', tab: 'rules' })">
          Rules
        </a>
      </ng-container>

      <a role="menuitem" class="sign-out-link" (click)="signOut()">Sign Out</a>
    </ng-container>
  </div>
</nav>
