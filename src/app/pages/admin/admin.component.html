<div class="admin-shell">
  <header class="admin-header">
    <h1 class="admin-title">Admin</h1>
    <p class="admin-subtitle">League management portal</p>
  </header>

  <!-- Tabs rather than a grid of cards: every section used to be two
       navigations away, back to the menu and into the next one. -->
  <nav class="admin-tabs" aria-label="Admin sections">
    <button
      *ngFor="let tab of tabs"
      type="button"
      class="admin-tab"
      [class.admin-tab--active]="isActive(tab)"
      [class.admin-tab--disabled]="tab.disabled"
      [disabled]="tab.disabled ?? false"
      [attr.aria-current]="isActive(tab) ? 'page' : null"
      [title]="tab.subtitle"
      (click)="navigate(tab)"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path [attr.d]="tab.iconPath" />
      </svg>
      <span>{{ tab.label }}</span>
    </button>
  </nav>

  <p class="admin-hint" *ngIf="atRoot">Pick a section above.</p>

  <router-outlet />
</div>
