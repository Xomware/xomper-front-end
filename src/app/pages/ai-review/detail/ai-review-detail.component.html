<div class="ai-review-detail">

  <!-- Back button -->
  <button class="ai-review-detail__back" (click)="goBack()" aria-label="Go back">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
      <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
    </svg>
    Back
  </button>

  <!-- Loading skeleton -->
  <div *ngIf="isLoading" class="ai-review-detail__skeleton" aria-busy="true">
    <div class="skeleton skeleton--chip"></div>
    <div class="skeleton skeleton--title"></div>
    <div class="skeleton skeleton--body"></div>
    <div class="skeleton skeleton--body skeleton--body-short"></div>
  </div>

  <!-- Error state -->
  <div *ngIf="!isLoading && hasError" class="ai-review-detail__error">
    <p>Report not found or failed to load.</p>
    <button class="btn-back" (click)="goBack()">Go back</button>
  </div>

  <!-- Not found (no error, just null) -->
  <div *ngIf="!isLoading && !hasError && !report" class="ai-review-detail__not-found">
    <p>Report not found.</p>
    <button class="btn-back" (click)="goBack()">Go back</button>
  </div>

  <!-- Populated report -->
  <ng-container *ngIf="!isLoading && report">

    <!-- Header card -->
    <div class="ai-review-detail__header-card">
      <div class="ai-review-detail__header-meta">
        <span
          class="ai-review-detail__chip"
          [style.background-color]="accentColor"
        >{{ typeLabel }}</span>
        <span class="ai-review-detail__period">{{ formattedPeriod }}</span>
      </div>
      <p class="ai-review-detail__date">{{ createdAtDisplay }}</p>
    </div>

    <!-- Body card — styled markdown -->
    <div class="ai-review-detail__body-card">
      <app-styled-markdown [markdown]="report.bodyMarkdown" />
    </div>

    <!-- Footer meta -->
    <div *ngIf="report.model || report.promptVersion" class="ai-review-detail__footer">
      <span *ngIf="report.model" class="ai-review-detail__meta-tag">
        Model: {{ report.model }}
      </span>
      <span *ngIf="report.promptVersion" class="ai-review-detail__meta-tag">
        Prompt: {{ report.promptVersion }}
      </span>
    </div>

  </ng-container>
</div>
