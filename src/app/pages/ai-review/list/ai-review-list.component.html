<div class="ai-review-list">
  <header class="ai-review-list__header">
    <h1 class="ai-review-list__title">AI Reviews</h1>
    <p class="ai-review-list__subtitle">League reports generated by AI — newest first.</p>
  </header>

  <!-- Loading skeleton -->
  <div *ngIf="isLoading" class="ai-review-list__skeletons" aria-busy="true" aria-label="Loading reports">
    <div class="skeleton-row" *ngFor="let n of [1,2,3,4,5]"></div>
  </div>

  <!-- Error state -->
  <div *ngIf="!isLoading && hasError" class="ai-review-list__error">
    <p>Failed to load reports.</p>
    <button class="btn-retry" (click)="retry()">Try again</button>
  </div>

  <!-- Empty state -->
  <div
    *ngIf="!isLoading && !hasError && reports.length === 0"
    class="ai-review-list__empty"
  >
    <p>No reports yet — first one lands after the next draft.</p>
  </div>

  <!-- Report list -->
  <ul *ngIf="!isLoading && !hasError && reports.length > 0" class="ai-review-list__rows">
    <li *ngFor="let report of reports" class="ai-review-list__item">
      <app-ai-report-card-row
        [report]="report"
        (tap)="navigateToDetail(report)"
      />
    </li>
  </ul>

  <!-- IntersectionObserver sentinel — triggers loadMore when scrolled into view -->
  <div
    *ngIf="!isLoading && !hasError"
    #sentinel
    class="ai-review-list__sentinel"
    aria-hidden="true"
  ></div>

  <!-- Load-more spinner row -->
  <div *ngIf="isLoadingMore" class="ai-review-list__loading-more" aria-label="Loading more reports">
    <div class="spinner"></div>
  </div>

  <!-- End of list -->
  <p
    *ngIf="!isLoading && !hasError && !nextCursor && reports.length > 0"
    class="ai-review-list__end"
  >
    All reports loaded.
  </p>
</div>
